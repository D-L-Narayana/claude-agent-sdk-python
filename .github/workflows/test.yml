name: Test

# workflow_dispatch is a manual fallback that runs the OFFLINE jobs only
# (test, test-mcp-v1-floor, test-min-python). Under a manual event the
# real-API jobs (test-e2e, test-e2e-docker, test-examples) are skipped by
# their gate even when the federation variables are configured, so a green
# manual run proves the offline suite, not real-API validation. It does not
# diagnose or repair a missing automatic run; the automatic triggers below
# are unchanged.
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm the newest mcp major is under test
        # test-mcp-v1-floor covers mcp 1.x; this job must exercise 2.x or newer.
        run: |
          python -c "import importlib.metadata as m; v = m.version('mcp'); print('mcp', v); assert int(v.split('.')[0]) >= 2, v"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=claude_agent_sdk --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0 (sha-pinned)
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-mcp-v1-floor:
    # The main test job resolves the newest mcp the SDK allows (2.x). This one
    # pins the oldest supported release so mcp 1.x support stays tested.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies with the mcp floor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mcp==1.23.0"
          python -c "import importlib.metadata as m; v = m.version('mcp'); print('mcp', v); assert v == '1.23.0', v"

      - name: Run mypy against mcp 1.x
        run: |
          mypy src/ scripts/

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=claude_agent_sdk --cov-report=xml

      - name: Upload coverage to Codecov
        # Merged with the main job's report, so code that only runs on one
        # mcp major is counted from whichever job exercises it.
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0 (sha-pinned)
        with:
          file: ./coverage.xml
          flags: mcp-v1-floor
          fail_ci_if_error: false

  test-min-python:
    # The jobs above run on the newest Python only. This one runs the suite on
    # the oldest Python the package declares (requires-python in
    # pyproject.toml), so a 3.11+-only construct fails on the PR instead of in
    # the manual publish workflow's version matrix.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Quoted: an unquoted 3.10 is the YAML float 3.1.
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  test-e2e:
    # Runs on pushes and same-repository PRs, and only when the workload-identity
    # variables are configured. A fork without them skips this job instead of
    # failing in setup-claude-auth -- and then no real-API validation ran, which
    # is not the same as the offline jobs passing. An external PR never gets this
    # job, even when the base repository has the variables: its OIDC token could
    # not be exchanged for a Claude API token. GitHub reads an unset variable as ''.
    if: >-
      (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
      && vars.ANTHROPIC_ORGANIZATION_ID != ''
      && vars.ANTHROPIC_SERVICE_ACCOUNT_ID != ''
    runs-on: ${{ matrix.os }}
    needs: test # Run after unit tests pass
    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for a Claude API access
      # token (workload identity federation)
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Claude Code (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        # `shell: bash` runs with -eo pipefail. Without pipefail the pipeline
        # takes its status from `bash`, which exits 0 on an empty script, so a
        # failed `curl` shows up later as a confusing "claude: not found" in a
        # different step. With it, the step that actually broke is the one that
        # fails.
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        run: |
          irm https://claude.ai/install.ps1 | iex
          $claudePath = "$env:USERPROFILE\.local\bin"
          echo "$claudePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Verify Claude Code installation
        run: claude -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Claude API auth (workload identity federation)
        uses: ./.github/actions/setup-claude-auth

      # CI's fresh checkout is an untrusted workspace, so Claude Code drops
      # the project-scoped permissions.allow grants in this repo's committed
      # .claude/settings.json and warns on stderr about it. Record the trust a
      # developer grants via the trust dialog once, so runs launched from the
      # checkout exercise the real trusted-workspace settings path. Only
      # affects CLI runs whose cwd is inside the checkout (some e2e tests
      # deliberately use a temp cwd). See scripts/trust_workspace.py.
      - name: Trust the workspace for Claude Code
        run: python scripts/trust_workspace.py

      - name: Run end-to-end tests with real API
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        run: |
          python -m pytest e2e-tests/ -v -m e2e

  test-e2e-docker:
    # Same gate as test-e2e (see the comment there): a trusted event -- a push,
    # or a PR from this repository -- and the workload-identity variables
    # configured. A fork without them skips this job.
    if: >-
      (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
      && vars.ANTHROPIC_ORGANIZATION_ID != ''
      && vars.ANTHROPIC_SERVICE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    needs: test # Run after unit tests pass
    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for a Claude API access
      # token (workload identity federation)
      id-token: write
    # Run e2e tests in Docker to catch container-specific issues like #406

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker test image
        run: docker build -f Dockerfile.test -t claude-sdk-test .

      - name: Set up Claude API auth (workload identity federation)
        uses: ./.github/actions/setup-claude-auth

      - name: Run e2e tests in Docker
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        # Bind-mount the identity token file so the background refresher on
        # the host keeps the in-container copy fresh too
        run: |
          docker run --rm \
            -e ANTHROPIC_FEDERATION_RULE_ID \
            -e ANTHROPIC_ORGANIZATION_ID \
            -e ANTHROPIC_SERVICE_ACCOUNT_ID \
            -e ANTHROPIC_IDENTITY_TOKEN_FILE=/run/claude-identity-token \
            -v "$ANTHROPIC_IDENTITY_TOKEN_FILE:/run/claude-identity-token:ro" \
            claude-sdk-test python -m pytest e2e-tests/ -v -m e2e

  test-examples:
    # Same gate as test-e2e (see the comment there): a trusted event -- a push,
    # or a PR from this repository -- and the workload-identity variables
    # configured. A fork without them skips this job.
    if: >-
      (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
      && vars.ANTHROPIC_ORGANIZATION_ID != ''
      && vars.ANTHROPIC_SERVICE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    needs: test-e2e # Run after e2e tests
    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for a Claude API access
      # token (workload identity federation)
      id-token: write
    env:
      # Pin the CLI's default model for the examples instead of taking the
      # one the installed CLI ships with, which changes between releases.
      # Same value as e2e-tests/conftest.py; see the comment there.
      ANTHROPIC_DEFAULT_MODEL: claude-opus-5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Claude Code (Linux)
        if: runner.os == 'Linux'
        # `shell: bash` runs with -eo pipefail; see the note in the test job.
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        run: |
          irm https://claude.ai/install.ps1 | iex
          $claudePath = "$env:USERPROFILE\.local\bin"
          echo "$claudePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Verify Claude Code installation
        run: claude -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Claude API auth (workload identity federation)
        uses: ./.github/actions/setup-claude-auth

      # Same as in test-e2e: trust the fresh checkout so Claude Code honors the
      # project-scoped grants in this repo's committed .claude/settings.json.
      - name: Trust the workspace for Claude Code
        run: python scripts/trust_workspace.py

      - name: Run example scripts (Linux)
        if: runner.os == 'Linux'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/quick_start.py
          timeout 300 python examples/streaming_mode.py all
          timeout 120 python examples/hooks.py PreToolUse
          timeout 120 python examples/hooks.py DecisionFields

      - name: Run example scripts (Windows)
        if: runner.os == 'Windows'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/quick_start.py
          $job = Start-Job { python examples/streaming_mode.py all }
          Wait-Job $job -Timeout 300 | Out-Null
          Stop-Job $job
          Receive-Job $job

          $job = Start-Job { python examples/hooks.py PreToolUse }
          Wait-Job $job -Timeout 120 | Out-Null
          Stop-Job $job
          Receive-Job $job

          $job = Start-Job { python examples/hooks.py DecisionFields }
          Wait-Job $job -Timeout 120 | Out-Null
          Stop-Job $job
          Receive-Job $job
        shell: pwsh
