name: Lint

# workflow_dispatch is a manual fallback that runs this OFFLINE lint job on a
# chosen ref: ruff and mypy, nothing that reaches the Claude API. A green
# manual run proves lint and types, not real-API validation (the Test
# workflow's real-API jobs are skipped under a manual event too). It does not
# diagnose or repair a missing automatic run; the automatic triggers below
# are unchanged.
on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run ruff
      run: |
        ruff check src/ tests/ scripts/ examples/
        ruff format --check src/ tests/ scripts/ examples/
    
    - name: Run mypy
      run: |
        mypy src/ scripts/